name: gps_control_client
description: GPS Control EC - App Cliente
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.3
  flutter_map: ^6.2.1
  latlong2: ^0.9.1
  permission_handler: ^11.3.1
  url_launcher: ^6.2.6
  web_socket_channel: ^3.0.3
  telephony: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
